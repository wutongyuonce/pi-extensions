id: no-return-value-in-generator
valid:
  - |
    def gen():
        yield 1
        yield 2
  - |
    def gen():
        yield 1
        return  # bare return is OK
  - |
    def regular():
        return 42
  - |
    @asynccontextmanager
    async def lifespan(app):
        def handler():
            return 42
        yield
invalid:
  - |
    def gen():
        yield 1
        return 42
  - |
    def gen():
        yield from iter([1, 2])
        return result
  - |
    def outer():
        def inner_gen():
            yield 1
            return 99
        return inner_gen
