id: no-assert-tuple
language: Python
message: "Assert should not be called on a tuple literal"
severity: warning
note: |
  Port of SonarCloud python:S5905.

  `assert (a, b)` is always truthy because the tuple `(a, b)` is a
  non-empty object. The developer probably meant `assert a, b` (an
  assertion with a message) or `assert (a == b)`.

  Bind the assertion's condition separately from its optional message,
  then require that condition to be a tuple or a parentheses-only chain
  ending in a tuple. Comparisons, calls, comprehensions, containers, and
  tuple-valued assertion messages remain valid. The rule remains a
  warning pending the multi-corpus false-positive audit required for
  error severity.
metadata:
  sonar: S5905
rule:
  pattern: assert $COND
constraints:
  COND:
    any:
      - kind: tuple
      - all:
          - kind: parenthesized_expression
          - has:
              kind: tuple
              stopBy:
                not:
                  any:
                    - kind: parenthesized_expression
                    - kind: tuple
