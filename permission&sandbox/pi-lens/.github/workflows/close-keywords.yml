name: Close-keyword syntax

on:
  pull_request:
    branches: [master]
    # Title edits can add or remove a close keyword after the initial check.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: close-keywords-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  lint:
    name: Close-keyword syntax
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default. This job runs
    # on pull_request so --branch master matched no runs; measured max over the
    # last 10 successful runs regardless of branch: 14s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Validate per-issue close keywords
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-close-keywords.mjs --lint-pr
